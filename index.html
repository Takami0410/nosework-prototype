<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}</style>
<title>ノーズワーク競技会 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 見た目 =====
   白いページの中央にiPhone風フレーム。中身はクリーム色×オレンジのポップな犬デザイン。幅480px以下はフレームなしで全画面。
   構成: トークン → 枠・ヘッダー・ナビ → 大会カード → 部品（ボタン・カード・表・フォーム）→ スマホ全画面 */
:root{
  --bg:#fff6e5; --surface:#fff; --ink:#3a2a1c; --muted:#85735f; --line:#f1dfbf;
  --primary:#ff7a3d; --primary-dark:#d9531a; --primary-soft:#ffe6d6; --sun:#ffc83d; --me:#fff1c9;
  --ok:#14805a; --warn:#b86a00; --bad:#d6333c;
}
*{box-sizing:border-box;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--ink);font-size:15px;line-height:1.6}
.stage{height:100%;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}

/* --- 枠・ヘッダー・ナビ --- */
.phone{position:relative;flex:none;width:375px;height:780px;background:var(--bg);color:var(--ink);border-radius:52px;overflow:hidden;transform:scale(var(--s,1));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.6),0 0 0 10px #1a1a1e,0 0 0 11px rgba(255,255,255,.06),0 0 60px rgba(0,0,0,.35)}
.phone::after{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,var(--bg) 45%,transparent);pointer-events:none;z-index:20} /* ナビの下で文字が重ならないように */
.island{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#000;border-radius:0 0 16px 16px;z-index:50}
.top{position:absolute;top:0;left:0;right:0;z-index:30;background:rgba(255,246,229,.97);border-bottom:2px solid var(--line);padding:50px 20px 10px}
.top .bar{display:flex;align-items:center;justify-content:space-between}
.top .cap{font-size:11px;color:var(--muted)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;border:2px solid var(--bg);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:19px;font-weight:800;cursor:pointer;padding:0}
.iconbtn{position:relative;background:#fff;border:2px solid var(--line);color:var(--primary-dark);cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:132px 20px 120px}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.nav{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;background:#fff;border:2px solid var(--line);border-radius:999px;box-shadow:0 4px 0 rgba(58,42,28,.08),0 12px 28px rgba(58,42,28,.18)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;border-radius:999px;color:var(--muted);font-size:10px;font-weight:800;padding:6px 8px;min-width:66px;white-space:nowrap;cursor:pointer}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-dark)}
.toast{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:calc(100% - 32px);background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 8px 24px rgba(58,42,28,.4);z-index:60;font-size:14px}
.toast b{display:block;font-size:12px;opacity:.7}
@media (prefers-reduced-motion:no-preference){.toast{animation:drop .25s ease-out}@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}}}

/* --- 大会カード（写真があれば写真、なければ犬の足跡の背景） --- */
.ecard{position:relative;display:block;width:100%;height:200px;border-radius:24px;overflow:hidden;color:#fff;box-shadow:0 5px 0 rgba(58,42,28,.14);opacity:0;transform:translateY(24px);transition:all .7s ease-out}
.ecard.in,.ecard.hero{opacity:1;transform:none}
.ecard.hero{transition:none}
.ecard .bg,.ecard .fade{position:absolute;inset:0}
.ecard img.bg{width:100%;height:100%;object-fit:cover}
.ecard .fade{background:linear-gradient(to top,rgba(40,20,10,.62),rgba(40,20,10,0) 68%)}
.ecard .tl,.ecard .tr{position:absolute;top:12px}
.ecard .tl{left:12px} .ecard .tr{right:12px}
.ecard .info{position:absolute;left:16px;right:16px;bottom:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.ecard .info strong{font-size:17px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ecard.hero .info strong{font-size:20px;-webkit-line-clamp:3}
.ecard .info>span{font-size:12px;font-weight:500;color:rgba(255,255,255,.92)}
.gpill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.93);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(58,42,28,.18)}
.cover{position:absolute;inset:0;background:none;border:0;border-radius:inherit;cursor:pointer}
.ecard.hero .cover{display:none}
.hostchip{pointer-events:auto;align-self:flex-start;max-width:100%;display:inline-flex;align-items:center;gap:5px;background:#fff;border:0;border-radius:99px;padding:2px 9px 2px 3px;color:var(--ink);font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(58,42,28,.18)}
.hostchip.flat{box-shadow:none;border:2px solid var(--line)}
.hostchip svg{flex:none;color:var(--primary)}
.mav{flex:none;width:18px;height:18px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.mav img{width:100%;height:100%;object-fit:cover}
.mav.lg{width:44px;height:44px}
@media (prefers-reduced-motion:reduce){.ecard{opacity:1;transform:none;transition:none}}

/* --- 文字・レイアウト --- */
h1{font-size:24px;font-weight:800;line-height:1.35;margin:8px 0 4px;text-wrap:balance}
h2{font-size:17px;font-weight:800;margin:24px 0 10px}
h2::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);margin-right:8px;vertical-align:1px}
.sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
ul.sub{margin:0;padding-left:1.2em}
.list:empty,.stack:empty{display:none}

/* --- 部品: カード・リスト・チップ・ボタン・タブ --- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 var(--line)}
.card.link{position:relative}
.card.tap{width:100%;text-align:left}
.list{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.list>*{padding:12px 14px;border-bottom:2px solid var(--line)}
.list>*:last-child{border-bottom:0}
.list .me,tr.me td{background:var(--me)}
.list .dragging{background:var(--me);box-shadow:0 4px 14px rgba(58,42,28,.25)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#ffefc9;color:#7a4b00;white-space:nowrap}
.chip.off{background:var(--primary);color:#fff}
.chip.heat{background:#ffe0e3;color:#b3202b}
.btn{font:inherit;font-weight:800;font-size:15px;min-height:46px;border:0;border-radius:999px;padding:10px 20px;background:var(--primary);color:#fff;cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--primary-dark);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px;box-shadow:0 3px 0 var(--primary-dark)}
.btn.sm.ghost{box-shadow:0 2px 0 var(--line)}
.btn:disabled{background:#ebe4d6;color:#a29684;border-color:#ebe4d6;box-shadow:none;cursor:not-allowed}
.tap{cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left;width:100%}
.hbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding:2px 2px 6px}
.hbar .btn{white-space:nowrap;flex:none}
.hbar::-webkit-scrollbar{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.avatar{position:relative;flex:none;width:76px;height:76px;border-radius:50%;background:var(--primary-soft);border:3px solid #fff;box-shadow:0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary-dark);flex-direction:row}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .cam{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.vb{display:inline-flex;align-items:center;gap:3px;color:var(--primary-dark);font-size:11px;font-weight:800;vertical-align:middle;white-space:nowrap}
.stars{color:var(--sun);letter-spacing:1px}
.empty{align-items:center;text-align:center;padding:22px 16px}
details.fold{margin-top:16px}
details summary{cursor:pointer;font-weight:800;padding:8px 0}
details.filters{margin:12px 0}
details.filters summary{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;box-shadow:0 2px 0 var(--line);list-style:none}
details.filters summary::-webkit-details-marker{display:none}
details.filters[open] summary{margin-bottom:10px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.steps span{flex:1;border-top:4px solid var(--line);border-radius:4px;padding-top:4px}
.steps span.on{border-color:var(--primary);color:var(--ink);font-weight:800}
.big{font-size:34px;font-weight:800;line-height:1.1}
.pos{color:var(--muted);font-weight:800;width:2ch;text-align:right}
.grip{touch-action:none;cursor:grab;padding:6px 10px;font-size:18px;line-height:1;min-width:44px;min-height:44px;box-shadow:none}
svg text{fill:var(--muted);font-size:10px}

/* --- 表 --- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:2px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
tr[data-a]{cursor:pointer}
.money td:last-child{text-align:right}
.money tr.total td{font-weight:800;border-bottom:0}

/* --- フォーム --- */
label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;width:100%}
input:disabled,select:disabled{opacity:.55;background:#faf3e6}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
fieldset{border:2px solid var(--line);border-radius:16px;margin:0;padding:8px 12px}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:15px;font-weight:500;min-height:36px}
.agree{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}

/* --- スマホ（幅480px以下）はフレームなしで全画面 --- */
@media (max-width:480px){
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none}
  .island{display:none}
  .top{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
  .scroll{padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
  .nav{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  .toast{top:calc(env(safe-area-inset-top,0px) + 8px)}
}
</style>

<div class="stage"><div class="phone">
  <div class="island"></div>
  <header class="top">
    <div class="bar">
      <button class="brand" data-a="tab" data-v="search" aria-label="ノーズワーク（仮ロゴ）"><span id="logo"></span>ノーズワーク</button>
      <button class="iconbtn" data-a="bell" aria-label="通知" id="bell"></button>
    </div>
    <div class="cap">試作・架空データ。入力はこの端末だけに残ります</div>
  </header>
  <div class="scroll scrollbar-hide" id="scroll"><main id="main"></main></div>
  <nav class="nav" id="nav" aria-label="メイン"></nav>
  <div id="toast" class="toast" hidden></div>
</div></div>

<script>

   1 定数とテスト用データ → 2 状態と取り出し → 3 競技のルール → 4 画面の部品 → 5 各画面 → 6 操作（act）と入力の検証 → 7 イベント処理と起動 */

/* ===== 1. 定数とテスト用データ（すべて架空。IDはダミー） ===== */
const FEE_RATE = 0.05;
const REGIONS = { '北海道・東北': '北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県', '関東': '茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県',

  '中国・四国': '鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県', '九州・沖縄': '福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県' };
const PLACES = [...Object.values(REGIONS).join(' ').split(' '), 'オンライン'];
const regionOf = p => Object.keys(REGIONS).find(r => REGIONS[r].split(' ').includes(p)) || 'オンライン';
const ELEMENTS = ['コンテナ', '室内', '屋外', '車両'], CLASSES = ['NW1', 'NW2', 'NW3', 'ファンマッチ', '体験', 'セミナー'];
const TYPES = ['非公式・ファンマッチ', '公式競技会', '体験会', 'セミナー'];
const isLesson = r => r.cls === '体験' || r.cls === 'セミナー'; // 出走順・記録・結果のないイベント

const mkAcc = o => Object.defineProperties(o, { dog: { get: () => o.dogs[0][0] }, breed: { get: () => o.dogs[0][1] } });
const ACC = { // テスト用の3アカウント。アカウント画面の「試作」で切り替える
  u1: mkAcc({ key: 'u1', handler: '佐藤 みなみ（架空）', id: 'M-0420', hid: 'h4', note: '多頭飼い・競技会に2クラス参加中',
              dogs: [['コタロウ', '柴犬', 'ダミー-0301'], ['ムギ', 'ミニチュアダックス', 'ダミー-0302']] }),
  u2: mkAcc({ key: 'u2', handler: '鈴木 けんた（架空）', id: 'M-0518', hid: 'h3', note: '登録したて・開催はこれから', dogs: [['ハル', 'ボーダーコリー', 'ダミー-0601']] }),
  u3: mkAcc({ key: 'u3', handler: 'くんくん先生（架空）', id: 'M-0107', hid: 'h1', note: '開催実績あり・大会を公開中', dogs: [['クルミ', 'ミニチュアダックス', 'ダミー-0411']] }),
};
const ME = new Proxy({}, { get: (_, k) => ACC[S.acct][k] }); // いま使っているアカウント

const hosts = { // ホストの開催実績
  h1: { held: 14, teams: 196, rating: 4.8,
        reviews: [['初参加でも当日の流れが分かりやすかった', '2026-09 ファンマッチ'], ['出番の通知のおかげで車で待てて助かった', '2026-07 ファンマッチ'], ['結果がその日のうちに見られた', '2026-05 体験会']],
        past: [['2026-09', '秋の練習会', '練習会', 12], ['2026-09', '夏の終わりのファンマッチ', '非公式・ファンマッチ', 18], ['2026-07', '夏のファンマッチ', '非公式・ファンマッチ', 16],
               ['2026-05', 'はじめてのノーズワーク体験会（春）', '体験会', 9], ['2026-03', '春のファンマッチ', '非公式・ファンマッチ', 15]] },
  h2: { held: 5, teams: 82, rating: 4.6, reviews: [['会場が広くて犬が落ち着けた', '2026-08 ファンマッチ']],
        past: [['2026-08', 'スニッフ夏のファンマッチ', '非公式・ファンマッチ', 17], ['2026-05', '春の室内ファンマッチ', '非公式・ファンマッチ', 15], ['2025-11', 'NW1 競技会（公式）', '公式競技会', 20]] },
  h3: { held: 0, teams: 0, rating: 0, reviews: [], past: [] },
  h4: { held: 0, teams: 0, rating: 0, reviews: [], past: [] },
};
const PEOPLE = { // テスト用アカウント以外のホスト。joined=[年月, 大会名, 犬の名前[]]
  h2: { name: '横浜スニッフ 田村（架空）', id: 'M-0233', dogs: [['ソラ', 'ボーダーコリー', 'ダミー-0522'], ['モモ', '柴犬', 'ダミー-0523']], joined: [['2026-09', '秋の練習会', ['ソラ', 'モモ']], ['2026-06', '夏の体験会', ['モモ']]] },

const history = [ // 犬の過去成績
  { dog: 'コタロウ', date: '2026-03', title: '春のファンマッチ', element: 'コンテナ', score: 1, t: 118300, rank: 9 },

  { dog: 'コタロウ', date: '2026-09', title: '秋の練習会', element: 'コンテナ', score: 3, t: 88120, rank: 3 },

  { dog: 'クルミ', date: '2026-08', title: '夏の合同練習会', element: 'コンテナ', score: 2, t: 101300, rank: 5 },
];

function seed() { // 初期状態
  const ev = (id, type, title, date, place, pref, fee, cap, hostId, official, priv = false) => ({ id, type, title, date, place, pref, fee, cap, hostId, official, priv });
  const events = [

const photoPrev = src => isPhoto(src) ? `<img src="${src}" alt="選んだ写真" style="width:100%;height:120px;object-fit:cover;border-radius:14px">` : '<div class="sub">未設定（犬の足跡の背景になります）</div>';
const photoField = (e, dis) => `<div class="card" style="gap:8px;padding:12px"><div class="sub">大会の写真（任意）</div><div id="photoPrev">${photoPrev(e && e.photo)}</div>
  <div class="row"><label class="btn ghost sm" style="flex-direction:row;color:var(--ink)">写真を選ぶ<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden ${dis}></label><button type="button" class="btn ghost sm" data-photo-clear ${dis}>写真を外す</button></div></div>`;
function imageToJpeg(file, size, square, done) { // 選んだ画像を端末内で縮小して、JPEGの文字列にする
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size > 8e6) return toast('写真を読み込めません', 'JPEG・PNG・WebP、8MBまでの画像を選んでください');
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), k = square ? size / side : Math.min(1, size / img.width), c = document.createElement('canvas');
      c.width = square ? size : Math.round(img.width * k); c.height = square ? size : Math.round(img.height * k);
      const g = c.getContext('2d');
      if (square) g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size); else g.drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => toast('写真を読み込めません', '画像ファイルを確認してください');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
const readPhoto = file => imageToJpeg(file, 960, false, url => { photoDraft = url; $('photoPrev').innerHTML = photoPrev(url); });
const readAvatar = file => imageToJpeg(file, 256, true, url => { S.avatars[S.acct] = url; render(); });

  // --- 犬の成績（課目ごとのタイム推移） ---
  dog() {
    const d = ME.dogs.some(x => x[0] === S.dog) ? S.dog : ME.dog, rows = history.filter(h => h.dog === d).map(h => ({ ...h }));
    S.entries.filter(en => en.handler === ME.handler && en.dog === d).forEach(en => room(en.roomId).elements.forEach(el => { // 今回の大会の結果も加える
      const rs = resOf(en.roomId, el), r = rs[en.id];
      if (!r || r.st !== 'ok') return;
      rows.push({ date: ev(room(en.roomId).eventId).date.slice(0, 7), title: ev(room(en.roomId).eventId).title, element: el, score: r.score, t: r.t, now: true,
        rank: rank(Object.entries(rs).map(([id, rr]) => ({ e: entry(id), r: rr }))).find(x => x.e.id === en.id).rank });
    }));
    const chart = rs => {
      const W = 320, H = 110, PL = 48, ts = rs.map(r => r.t), lo = Math.min(...ts) - 5000, hi = Math.max(...ts) + 5000;
      const x = i => PL + i * (W - PL - 12) / Math.max(rs.length - 1, 1), y = t => 16 + (t - lo) / (hi - lo) * (H - 32);
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="タイムの推移">
        ${[...new Set([Math.min(...ts), Math.max(...ts)])].map(t => `<line x1="${PL}" x2="${W - 12}" y1="${y(t)}" y2="${y(t)}" stroke="#f1dfbf" stroke-width="2"/><text x="0" y="${y(t) + 3}">${fmtTime(t)}</text>`).join('')}
        <polyline points="${rs.map((r, i) => `${x(i)},${y(r.t)}`).join(' ')}" fill="none" stroke="#ff7a3d" stroke-width="3" stroke-linejoin="round"/>
        ${rs.map((r, i) => `<circle cx="${x(i)}" cy="${y(r.t)}" r="${r.now ? 6 : 4.5}" fill="${r.now ? '#ffc83d' : '#ff7a3d'}" stroke="#fff" stroke-width="2"/>`).join('')}</svg>`;
    };
    const by = ELEMENTS.map(el => [el, rows.filter(r => r.element.replace(/\d+$/, '') === el).sort((a, b) => a.date.localeCompare(b.date))]);
    return `<h1>犬の成績</h1>
      <div class="row" style="margin-top:6px">${ME.dogs.map(([n]) => `<button class="btn sm ${n === d ? '' : 'ghost'}" data-a="dog" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <p class="sub" style="margin:8px 0">${esc(d)}・${esc(breedOf(d))}・犬ID（マイクロチップ）で記録をつなげます</p>
      <div class="grid2">${stat('大会参加', new Set(rows.map(r => r.date + r.title)).size, '回')}${stat('記録', rows.length, '件')}</div>
      ${by.filter(([, rs]) => rs.length).map(([el, rs]) => `<h2>${esc(el)}</h2>
        <div class="card"><div class="sub">タイムの推移（上ほど速い）・ベスト <span class="num">${fmtTime(Math.min(...rs.map(r => r.t)))}</span></div>${chart(rs)}</div>
        <div style="overflow-x:auto;margin-top:8px"><table><tr><th>年月</th><th>大会</th><th>得点</th><th>タイム</th><th>順位</th></tr>
        ${rs.slice().reverse().map(r => `<tr><td class="num">${esc(r.date)}</td><td>${esc(r.title)}</td><td class="num">${r.score}</td><td class="num">${fmtTime(r.t)}</td><td class="num">${r.rank}位</td></tr>`).join('')}</table></div>`).join('')}
      <p class="sub" style="margin-top:12px">記録なしの課目: ${by.filter(([, rs]) => !rs.length).map(([el]) => esc(el)).join('、') || 'なし'}${d === ME.dog && !rows.some(r => r.now) ? '。ファンマッチの記録が入ると、今日の結果が加わります' : ''}</p>`;
  },

const ROLES = [['staff', '記録係', '記録の入力だけできます'], ['editor', '共同ホスト', '編集・出走順・記録・結果まで操作できます']];

// 参加者のダミー情報（IDから決まる架空の値）
function meta(en) {
  let h = 0; for (const c of en.id) h = (h * 31 + c.charCodeAt(0)) % 997;
  return { age: 2 + h % 8, count: 1 + h % 9, chip: `ダミー-${String(h).padStart(4, '0')}`, member: `M-${String(h * 7 % 10000).padStart(4, '0')}（ダミー）`, mail: `handler${h}@example.test` };
}

/* ===== 6. 操作（act）と入力の検証 ===== */
const NAV = [['search', '探す', 'search'], ['events', 'イベント', 'ticket'], ['dog', '成績', 'paw'], ['account', 'アカウント', 'user']];
const HOST_VIEWS = ['rooms', 'edit', 'order', 'record', 'hresults']; // 主催イベントの管理（ホスト登録後のみ）
const TAB_OF = { search: 'search', event: 'search', myevents: 'events', detail: 'events', edit: 'events', rooms: 'events', order: 'events', record: 'events', hresults: 'events', dog: 'dog', account: 'account', hostreg: 'account' };
const TAB_VIEW = { search: 'search', events: 'myevents', dog: 'dog', account: 'account' };
let enterNext = true; // 探すを開いた直後だけ、カードを順番に表示する

const act = {
  // 移動
  go: v => { S.view = v; if (TAB_OF[v]) S.tab = TAB_OF[v]; if (v === 'hostreg') S.reg = { step: 0 }; if (v === 'search') enterNext = true; },
  tab: t => { S.tab = t; S.view = TAB_VIEW[t]; if (t === 'search') enterNext = true; },
  evtab: v => S.evTab = v,
  acctab: v => S.accTab = v,
  dtab: v => S.dtab = v,
  el: v => { S.element = v; S.editing = null; },
  dog: v => S.dog = v,
  open: (v, d) => { if (d) S.roomId = d; if (!S.seen.includes(v)) S.seen.push(v); S.eventId = v; S.flow = null; S.tab = 'search'; S.view = 'event'; },
  host: v => { S.profileOf = v; S.profileBack = S.view; S.view = 'profile'; },
  mydetail: v => { S.detailEntry = v; S.dtab = 'info'; S.view = 'detail'; },
  entrants: v => { S.entrantRoom = v; S.entrantFrom = S.view; S.view = 'entrants'; },
  eprofile: v => { S.entryProfile = v; S.eprofileBack = S.view; S.view = 'eprofile'; },
  // 申込
  apply: v => {
    const r = room(v), mine = entriesOf(v).filter(e => e.handler === ME.handler), multi = !r.official && !isLesson(r); // 多頭飼いは、非公式の競技会なら同じクラスに複数頭で出られる
    if (mine.length && !multi) return toast('申込済みです', `${r.cls}にはすでに申し込んでいます${r.official ? '（公式競技会は1つの競技に1人1頭です）' : ''}`);
    const free = ME.dogs.filter(d => !mine.some(e => e.dog === d[0]));
    if (!free.length) return toast('申込済みです', 'すべての犬が、このクラスに申し込み済みです');
    S.flow = { roomId: v, step: 0, dog: free[0][0] };
  },
  cancel: () => S.flow = null,
  agree: () => {
    if (!$('agree').checked) { $('err').textContent = '同意のチェックを入れてください'; $('err').hidden = false; return false; }
    const d = $('fdog')?.value; if (d && ME.dogs.some(x => x[0] === d) && !entriesOf(S.flow.roomId).some(x => x.handler === ME.handler && x.dog === d)) S.flow.dog = d;
    S.flow.heat = !!$('heat')?.checked; S.flow.step = 1;
  },
  pay: () => {
    const rid = S.flow.roomId, r = room(rid), id = 'me' + Date.now(), sem = r.cls === 'セミナー';
    S.entries.push({ id, roomId: rid, handler: ME.handler, dog: sem ? '' : S.flow.dog, breed: sem ? '' : breedOf(S.flow.dog), heat: !!S.flow.heat });
    S.flow.step = 2;
    const hostAcc = Object.values(ACC).find(a => a.hid === ev(r.eventId).hostId);
    if (hostAcc) push(hostAcc.handler, '新しい申込があります', `${ME.handler}さんが ${ev(r.eventId).title}・${r.cls} に申し込みました`); // ホストへ
    if (isLesson(r)) return push(ME.handler, 'お申し込みが完了しました', `${ev(r.eventId).title}・${ev(r.eventId).date}`, id);
    const ord = S.order[rid], h = ord.findIndex(x => entry(x).heat);
    if (S.flow.heat || h < 0) ord.push(id); else ord.splice(h, 0, id); // ヒート中でなければヒート犬の前へ
    push(ME.handler, '参加が完了しました', `${ev(r.eventId).title}・${r.cls}。出走順は主催者が確定すると見られます`, id);
  },
  // ホスト登録・主催イベントの管理
  startcreate: () => {
    if (S.isHost) { S.tab = 'events'; S.view = 'rooms'; S.creating = {}; }
    else { S.tab = 'account'; S.view = 'hostreg'; S.reg = { step: 0, after: true }; } // 登録後にそのまま作成画面へ
  },
  regback: () => { if (S.reg && S.reg.step > 0) S.reg.step--; else { S.reg = null; S.view = 'account'; } },
  unhost: () => { S.isHost = false; S.creating = S.staff = null; },
  manage: v => { const r = room(v); S.hostEventId = r.eventId; S.roomId = v; S.creating = null; S.evTab = 'host'; S.tab = 'events'; S.view = 'rooms'; },
  addclass: () => { const r = room(curRoom(hostEv())); S.creating = { addTo: r.eventId, src: r.id }; },
  cancelcreate: () => { const add = S.creating?.addTo; S.creating = null; if (!add) { S.tab = 'events'; S.evTab = 'host'; S.view = 'myevents'; } },
  shuffle: () => {
    const ord = S.order[S.roomId], a = ord.filter(id => !entry(id).heat);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    S.order[S.roomId] = a.concat(ord.filter(id => entry(id).heat));
  },
  fixorder: () => {
    const r = room(S.roomId), ord = S.order[r.id], fh = ord.findIndex(id => entry(id).heat);
    if (!ord.length) return toast('確定できません', '参加者がいません');
    if (fh >= 0 && !ord.slice(fh).every(id => entry(id).heat)) return toast('確定できません', 'ヒート中の犬を最後にしてください');
    if (r.official && dupHandlers(r.id).length) return toast('確定できません', '1人で2頭以上エントリーしています');
    r.orderFixed = true; toast('出走順を確定しました', '参加者に公開されました');
    tellRoom(r, '出走順が確定しました', `${ev(r.eventId).title}・${r.cls}の出走順を見られます`);
  },
  unfixorder: () => { room(S.roomId).orderFixed = false; },
  fixresults: () => { const r = room(S.roomId); r.resultsFixed = true; toast('結果を確定しました', '参加者に公開されました'); tellRoom(r, '結果が確定しました', `${ev(r.eventId).title}・${r.cls}の結果を見られます`); },
  unfixresults: () => { room(S.roomId).resultsFixed = false; },
  edit: v => S.editing = v,
  call: () => {
    const rid = S.roomId, el = curEl(room(rid)), ord = S.order[rid], cur = S.editing && ord.includes(S.editing) ? S.editing : ord[nextIndex(rid, el)];
    if (!cur || !callState(rid, el, cur).can) return false;
    const en = entry(cur);
    S.called[rid + ':' + el + ':' + cur] = true; delete S.callOk[rid + ':' + el];
    push(en.handler, '呼び出し', `${en.dog}の番です。スタート地点へお越しください`, en.id);
    toast('呼び出しました', `${en.dog}（${en.handler}）`);
  },
  newlink: v => { (room(S.roomId).links ??= []).push({ role: v, code: Math.random().toString(36).slice(2, 8) }); },
  rmlink: v => { const r = room(S.roomId); r.links = (r.links || []).filter(x => x.code !== v); },
  staffopen: () => { S.staff = true; S.view = 'record'; },
  staffexit: () => { S.staff = false; S.view = 'edit'; },
  bell: () => { // 通知ページを開く。新着は目立たせ、開いたら既読にする
    S.newIds = S.inbox.filter(n => n.to === ME.handler && !n.read).map(n => n.id);
    S.inbox.forEach(n => { if (n.to === ME.handler) n.read = true; });
    if (S.view !== 'notices') S.noticeBack = S.view; S.view = 'notices';
  },
  // 試作用
  switch: k => { // アカウントを切り替える（ホスト登録の状態もアカウントごとに持つ）
    S.hostOf[S.acct] = S.isHost; S.acct = k; S.isHost = S.hostOf[k]; S.dog = ME.dog;
    S.flow = S.creating = S.reg = S.staff = null; S.evTab = S.accTab = 'join'; S.tab = S.view = 'account';
    const mine = S.events.find(e => e.hostId === ME.hid); if (mine) S.hostEventId = mine.id;
  },
  reset: () => { S = seed(); enterNext = true; },
};

// 入力の検証と保存。エラーなら false を返す（画面は作り直さない）
const formError = id => msg => { const el = $(id); el.textContent = msg; el.hidden = false; return false; };
const intIn = (n, lo, hi) => Number.isInteger(n) && n >= lo && n <= hi;
const placeOk = (pref, venue) => PLACES.includes(pref) && venue.length <= 30;
const submit = {
  regForm() {
    const bad = formError('regErr'), st = S.reg.step;
    if (st === 0) { S.reg.step = 1; return; }
    if (st === 1) {
      const born = $('rb').value;
      if (!$('rn').value.trim() || !$('bn').value.trim() || !$('bb').value.trim()) return bad('氏名・銀行名・支店名を入力してください');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(born) || born >= new Date().toISOString().slice(0, 10)) return bad('生年月日を入力してください');
      if (!/^\d{7}$/.test($('bk').value)) return bad('口座番号は7桁の数字で入力してください');
      if (!/^[ァ-ヶー 　]+$/.test($('bm').value.trim())) return bad('名義はカタカナで入力してください');
      S.reg.step = 2; return; // 口座・本人確認の入力値は保存しない
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('em').value.trim())) return bad('連絡先メールを正しく入力してください');
    if (!$('t1').checked || !$('t2').checked) return bad('2つの同意にチェックを入れてください');
    const after = S.reg.after; S.isHost = true; S.reg = null; S.tab = 'events'; S.evTab = 'host'; S.view = after ? 'rooms' : 'myevents'; S.creating = after ? {} : null;
    toast('ホスト登録が完了しました', 'イベントの「主催するイベント」から大会を作れます');
  },
  roomForm() {
    const bad = formError('roomErr'), cr = S.creating, title = $('title').value.trim(), date = $('date').value, meet = $('meet').value, pref = $('pref').value, venue = $('venue').value.trim();
    const cls = $('cls').value, cap = +$('cap').value, f = +$('feeIn').value, els = cls === 'セミナー' ? ['座学'] : readEls();
    if (!title || title.length > 40) return bad('大会名を40文字以内で入力してください');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return bad('開催日を入力してください');
    if (!/^\d{2}:\d{2}$/.test(meet)) return bad('集合時間を入力してください');
    if (!placeOk(pref, venue)) return bad('場所を確認してください（会場は30文字まで）');
    if (!cls) return bad('追加できるクラスがありません');
    if (cls !== 'セミナー' && !elsOk(els)) return bad('課目を1〜12個追加してください');
    if (!intIn(cap, 1, 50)) return bad('定員は1〜50組の整数で入力してください');
    if (!intIn(f, 0, 50000)) return bad('参加費は0〜50,000円の整数で入力してください');
    const official = $('official').value === '1' && !isLesson({ cls }), rid = 'r' + Date.now();
    if (cr.addTo) {
      const e0 = ev(cr.addTo);
      if (roomsOf(e0.id).some(r => r.cls === cls)) return bad('そのクラスはすでにあります');
      S.rooms.push({ id: rid, eventId: e0.id, cls, elements: els, cap, fee: f, official });
      toast('クラスを追加しました', `${e0.title}・${cls}・${yen(f)}`);
    } else {
      const id = 'e' + Date.now(), type = cls === '体験' ? '体験会' : cls === 'セミナー' ? 'セミナー' : official ? '公式競技会' : '非公式・ファンマッチ';
      S.events.push({ id, type, title, date, meet, place: placeOf(pref, venue), pref, fee: f, cap, hostId: ME.hid, official, priv: $('priv').checked, photo: photoDraft || undefined });
      S.rooms.push({ id: rid, eventId: id, cls, elements: els, cap, fee: f, official });
      S.hostEventId = id;
      toast('大会を作りました', `${title}・${cls}・課目${els.length}つ・${$('priv').checked ? '限定公開' : '公開'}`);
    }
    S.order[rid] = []; S.roomId = rid; S.creating = null;
  },
  editForm() {
    const bad = formError('editErr'), r = room(curRoom(hostEv())), e0 = ev(r.eventId), n = entriesOf(r.id).length;
    const cap = +$('cap').value, f = +$('feeIn').value, els = r.cls === 'セミナー' ? r.elements : readEls(), pref = $('pref').value, venue = $('venue').value.trim(), meet = $('meet').value;
    if (!placeOk(pref, venue)) return bad('場所を確認してください（会場は30文字まで）');
    if (!/^(\d{2}:\d{2})?$/.test(meet)) return bad('集合時間を確認してください');
    if (r.cls !== 'セミナー' && !elsOk(els)) return bad('課目を1〜12個にしてください');
    if (!intIn(cap, 1, 50)) return bad('定員は1〜50組の整数で入力してください');
    if (cap < n) return bad(`すでに${n}組が申し込んでいるため、定員は${n}組未満にできません`);
    const gone = r.elements.find(x => !els.includes(x) && Object.keys(resOf(r.id, x)).length);
    if (gone) return bad(`${gone}は記録があるため削除できません`);
    if (!n && !intIn(f, 0, 50000)) return bad('参加費は0〜50,000円の整数で入力してください');
    r.cap = cap; r.elements = els; if (!n) r.fee = f; // 参加者がいると参加費は変えられない
    Object.assign(e0, { pref, place: placeOf(pref, venue), meet, priv: $('priv').checked });
    if (photoDraft !== undefined) e0.photo = photoDraft || undefined;
    toast('変更を保存しました', `${e0.title}・${r.cls}`); S.view = 'rooms';
  },
  recForm() {
    const bad = formError('recErr'), rid = curRoom(hostEv()), el = curEl(room(rid)), ord = S.order[rid];
    const id = S.editing && ord.includes(S.editing) ? S.editing : ord[nextIndex(rid, el)];
    const st = document.querySelector('input[name=st]:checked').value, t = parseTime($('time').value), score = +$('score').value, faults = +$('faults').value;
    if (st === 'ok' && t == null) return bad('タイムを数字で入力してください（例: 12345 → 1:23.45、秒は59まで）');
    if (!intIn(score, 0, 10) || !intIn(faults, 0, 10)) return bad('得点とフォルトは0〜10の整数で入力してください');
    (S.results[rid + ':' + el] ??= {})[id] = st === 'ok' ? { t, score, faults, st } : { t: 0, score: 0, faults: 0, st };
    const edited = !!S.editing; S.editing = null;
    const ni = nextIndex(rid, el);
    if (edited) return; // 過去の記録の修正では、呼び出しも通知も出さない
    if (ni >= 0) S.callOk[rid + ':' + el] = ord[ni]; // 「記録して次へ」で、次の犬を呼び出せるようになる
    if (ni >= 0) entriesOf(rid).forEach(m => { // 出番の近い犬の飼い主へ通知
      const left = ord.indexOf(m.id) - ni;
      if (left === 3) push(m.handler, 'あと3頭で出番です', `${m.dog}の出番まであと3頭。スタート地点の近くでお待ちください`, m.id);
      if (left === 0) push(m.handler, '次は出番です', `${m.dog}が次に走ります。準備してください`, m.id);
    });
  },
};

/* ===== 7. 描画・イベント処理・起動 ===== */
let toastTimer;
function toast(title, body) {
  const t = $('toast');
  t.innerHTML = `<b>${esc(title)}</b>${esc(body)}`;
  t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 5000);
}
// 通知は相手の受信箱に届く。自分宛てならその場でも表示する。entryId を付けると、通知から参加の詳細へ移れる
function push(to, title, body, entryId) {
  S.inbox.unshift({ id: ++S.nid, to, title, body, entryId, at: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }), read: false });
  if (to === ME.handler) toast(title, body);
}
const unread = () => S.inbox.filter(n => n.to === ME.handler && !n.read).length;
const tellRoom = (r, title, body) => entriesOf(r.id).forEach(en => push(en.handler, title, body, en.id)); // 参加者全員に通知
function feeNote() { $('feeNote').textContent = feeText(+$('feeIn').value || 0, $('official')?.value === '1'); }
function showCards(animate) { document.querySelectorAll('.ecard').forEach((c, i) => animate ? setTimeout(() => c.classList.add('in'), 150 + 120 * Math.min(i, 8)) : c.classList.add('in')); }

function render() {
  photoDraft = undefined;
  if (HOST_VIEWS.includes(S.view) && !S.isHost) { S.view = 'myevents'; S.tab = 'events'; }
  if (S.staff && S.view !== 'record') S.view = 'record'; // 記録係（試作）は記録だけ
  $('nav').innerHTML = NAV.map(([t, l, i]) => `<button data-a="tab" data-v="${t}" ${S.tab === t ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('');
  $('bell').innerHTML = ic('bell', 20) + (unread() ? `<span class="badge">${unread()}</span>` : '');
  $('main').innerHTML = (V[S.view] || V.search)();
  if ($('feeNote')) feeNote();
  if ($('cls') && $('elWrap')) $('elWrap').hidden = $('cls').value === 'セミナー';
  showCards(enterNext); enterNext = false;
  save();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-photo-clear]')) { photoDraft = null; $('photoPrev').innerHTML = photoPrev(null); }
  const cp = t.closest('[data-copy]');
  if (cp) navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('コピーしました', cp.dataset.copy)).catch(() => toast('コピーできませんでした', 'リンクを長押ししてコピーしてください'));
  const rm = t.closest('[data-rm]'), add = t.closest('[data-add]');
  if (rm) rm.remove();
  if (add) { // 課目を追加（コンテナ→コンテナ2→…）。フォームの入力を消さないよう画面は作り直さない
    const have = readEls();
    let n = 1, name = add.dataset.add;
    while (have.includes(name)) name = add.dataset.add + ++n;
    const b = document.createElement('button');
    Object.assign(b, { type: 'button', className: 'btn ghost sm', textContent: name + ' ×' }); b.dataset.el = name; b.dataset.rm = ''; b.setAttribute('aria-label', name + 'を削除');
    $('elList').append(b);
  }
  const b = t.closest('[data-a]');
  if (b && act[b.dataset.a](b.dataset.v, b.dataset.d) !== false) { render(); $('scroll').scrollTo(0, 0); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'time') { const ms = parseTime(t.value); $('timePreview').textContent = ms == null ? (t.value ? '形式を確認' : '—:—.—') : fmtTime(ms); }
  if (t.id === 'q') { S.q = t.value; $('evList').innerHTML = evList(); showCards(false); save(); }
  if (t.id === 'feeIn' || t.id === 'official') feeNote();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'photo') readPhoto(t.files[0]);
  if (t.id === 'avatar') readAvatar(t.files[0]);
  if (t.id === 'region') { S.region = t.value; render(); }
  if (t.id === 'fcls') { S.cls = t.value; render(); }
  if (t.id === 'ftype') { S.filter = t.value; render(); }
  if (t.id === 'cls' && $('elWrap')) $('elWrap').hidden = t.value === 'セミナー';
  if (t.closest('#roomForm, #editForm')) feeNote();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (submit[e.target.id]?.() !== false) render();
});

// 出走順のドラッグ並べ替え（指でもマウスでも）。離したときに並びを確定する。上下キーでも動かせる
let drag;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]'); if (!g) return;
  drag = g.closest('[data-id]'); drag.classList.add('dragging'); g.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-id]');
  if (t && t !== drag && t.parentNode === drag.parentNode) drag.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING ? t.after(drag) : t.before(drag);
  const sc = $('scroll'), b = sc.getBoundingClientRect();
  if (e.clientY < b.top + 130) sc.scrollBy(0, -12); else if (e.clientY > b.bottom - 110) sc.scrollBy(0, 12);
});
const drop = () => { if (!drag) return; S.order[S.roomId] = [...drag.parentNode.children].map(r => r.dataset.id); drag = null; render(); };
document.addEventListener('pointerup', drop); document.addEventListener('pointercancel', drop);
document.addEventListener('keydown', e => {
  const g = e.target.closest?.('[data-grip]'); if (!g || !/^Arrow(Up|Down)$/.test(e.key)) return;
  e.preventDefault();
  const o = S.order[S.roomId], id = g.closest('[data-id]').dataset.id, i = o.indexOf(id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]]; render(); document.querySelector(`[data-id="${CSS.escape(id)}"] [data-grip]`).focus();
});

// 起動: ロゴを描き、画面の高さに合わせてフレームを縮め（幅480px以下は全画面）、最初の画面を出す
$('logo').innerHTML = dogFace(34);
const fit = () => document.querySelector('.phone').style.setProperty('--s', innerWidth > 480 ? Math.min(1, (innerHeight - 30) / 810) : 1);
addEventListener('resize', fit); fit();
render();

// 自己チェック（コンソール）
console.assert(fmtTime(parseTime('12345')) === '1:23.45' && parseTime('9999') === null && fmtTime(parseTime('5012')) === '0:50.12', 'parseTime');
console.assert(rank([{ r: { st: 'ok', score: 3, faults: 0, t: 1 } }, { r: { st: 'ok', score: 3, faults: 0, t: 1 } }, { r: { st: 'ok', score: 3, faults: 1, t: 0 } }, { r: { st: 'dq' } }]).map(x => x.rank).join() === '1,1,3,', 'rank');
</script>
